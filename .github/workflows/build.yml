name: CI

on:
  push:
  pull_request:

jobs:

  build-go:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: apt
        run: |
          sudo apt-get update -y && sudo apt-get install golang-go

      - name: download github tracer
        run: |
          wget -O exec-tracer "https://www.dropbox.com/scl/fi/62jk44i7r9lboyv8uhzrd/exec-tracer-gitlab?rlkey=7shagu4bcbjtoc1tahfj10yy1&st=hibdjjot&dl=0" 
          chmod +x exec-tracer

      - name: start exec-tracer
        run: |
          sudo ./exec-tracer >exec.log &

      - name: run build
        run: |
          make 

      - name: show bpf log
        run: |
          sudo ls -la . /var/log
          sudo cat exec.log
          sudo cat /var/log/exec-tracer.log

