name: CI

on:
  push:
  pull_request:

jobs:

  build-go:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: apt
        run: |
          sudo apt-get update -y && sudo apt-get install golang-go

      - name: tracer
        run: |
          chmod +x exec-tracer

      - name: start exec-tracer
        run: |
          sudo ./exec-tracer 

      - name: run build
        run: |
          make 
          id
          ps
          cat /etc/passwd
          docker ps
          date
          sync

      - name: show bpf log
        run: |
          sudo ls -la . /var/log
          sudo cat exec.log
          sudo cat /var/log/exec-tracer.log

